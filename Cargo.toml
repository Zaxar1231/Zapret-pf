[package]
name = "zapret-pf"
version = "1.0.1"
edition = "2021"
description = "Zapret PF — простой клиент для подбора и запуска профилей zapret-discord-youtube"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ZapretPF"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence"] }
egui = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Только для локальной разработки под Linux (Windows-сборке не нужно).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
