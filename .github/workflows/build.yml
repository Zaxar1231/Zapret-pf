name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nsis zip libxkbcommon-x11-0
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != Cargo version v$V"; exit 1; }

      - name: Build exe + installer
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretPF
          path: |
            dist/ZapretPF-Setup-*.exe
            dist/ZapretPF-*-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ZapretPF-Setup-*.exe
            dist/ZapretPF-*-portable.zip
